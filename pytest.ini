[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
env =
    ENVIRONMENT=test
    SECRET_KEY=test-secret-key-test-secret-key-0123456789
    REDIS_URL=redis://localhost:6379/1
    DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5434/taskhub_test